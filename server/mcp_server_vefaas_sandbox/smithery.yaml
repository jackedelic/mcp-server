# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'mcp-server-vefaas-sandbox', args: ['--transport','stdio'], env: { SANDBOX_API: config.sandboxApi, AUTH_TOKEN: config.authToken } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - sandboxApi
      - authToken
    properties:
      sandboxApi:
        type: string
        description: veFaaS Code-Sandbox service APIG address, e.g.,
          xxxxxxxx.apigateway-cn-beijing.volceapi.com
      authToken:
        type: string
        description: Authentication token for the sandbox API
  exampleConfig:
    sandboxApi: your-sandbox-apig-address
    authToken: your-sandbox-apig-auth-token
